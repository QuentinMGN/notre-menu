<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Menu de la Semaine</title>
    <style>
        :root {
            --primary: #7A1C1C;
            --accent: #C0392B;
            --bg: #FDFBF7;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border: #E6DCCD;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
        header { background-color: var(--primary); color: white; padding: 15px; text-align: center; }
        .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: 0; z-index: 10; }
        .nav-tab { flex: 1; padding: 12px 8px; text-align: center; font-size: 0.8rem; font-weight: bold; color: var(--text-light); background: none; border: none; cursor: pointer; white-space: nowrap; }
        .nav-tab.active { color: var(--primary); border-bottom: 3px solid var(--accent); background-color: #FAF8F5; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; }
        h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 5px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        th, td { padding: 10px; text-align: left; font-size: 0.85rem; border-bottom: 1px solid #F0ECE1; }
        th { background: var(--text); color: white; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; }
        .btn-fav { background: #D4AC0D; }
        .btn-delete { background: var(--accent); padding: 4px 8px; font-size: 0.75rem; width: auto; }
    </style>
</head>
<body>
    <header><h1>👨‍🍳 Mon Menu Belge</h1></header>
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('planning')">📅 Planning</button>
        <button class="nav-tab" onclick="switchTab('manage')">✍️ Ajouter</button>
        <button class="nav-tab" onclick="switchTab('favs')">❤️ Favoris</button>
    </div>
    <div class="container">
        <div id="planning" class="section active">
            <h2>Planning</h2>
            <div id="planningContainer">Chargement...</div>
        </div>
        <div id="manage" class="section">
            <h2>Ajouter un Repas</h2>
            <div class="card">
                <label>Date :</label><input type="date" id="mealDate">
                <label>Nom du plat :</label><input type="text" id="recipeTitle" placeholder="Ex: Stoemp saucisse">
                <label>Recette :</label><textarea id="recipeDetails" rows="3" placeholder="Ingrédients et étapes..."></textarea>
                <button class="btn" onclick="saveMeal()">Ajouter au planning</button>
                <button class="btn btn-fav" onclick="saveFavorite()">Ajouter aux favoris ❤️</button>
            </div>
        </div>
        <div id="favs" class="section">
            <h2>Mes Favoris</h2>
            <div id="favContainer">Aucun favori.</div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('mealDate').valueAsDate = new Date();
            loadAll();
        });
        function switchTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        function saveMeal() {
            let d = document.getElementById('mealDate').value;
            let t = document.getElementById('recipeTitle').value;
            let det = document.getElementById('recipeDetails').value;
            if(!d || !t || !det) return alert("Remplis tout !");
            let meals = JSON.parse(localStorage.getItem('meals') || '{}');
            meals[d] = { title: t, details: det };
            localStorage.setItem('meals', JSON.stringify(meals));
            alert("Ajouté !");
            loadAll();
            switchTab('planning');
            document.querySelectorAll('.nav-tab')[0].classList.add('active');
        }
        function saveFavorite() {
            let t = document.getElementById('recipeTitle').value;
            let det = document.getElementById('recipeDetails').value;
            if(!t || !det) return alert("Remplis le titre et les détails !");
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            favs.push({ title: t, details: det });
            localStorage.setItem('favs', JSON.stringify(favs));
            alert("Ajouté aux favoris ❤️ !");
            loadAll();
        }
        function loadAll() {
            let meals = JSON.parse(localStorage.getItem('meals') || '{}');
            let pHTML = "<table><tr><th>Date</th><th>Plat</th></tr>";
            let keys = Object.keys(meals).sort();
            if(keys.length === 0) pHTML += "<tr><td colspan='2'>Aucun repas.</td></tr>";
            keys.forEach(k => {
                pHTML += `<tr><td>${k}</td><td><strong>${meals[k].title}</strong><br>${meals[k].details}<br><button class="btn btn-delete" onclick="delMeal('${k}')">Supprimer</button></td></tr>`;
            });
            pHTML += "</table>";
            document.getElementById('planningContainer').innerHTML = pHTML;

            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            let fHTML = "";
            if(favs.length === 0) fHTML = "Aucun favori.";
            favs.forEach((f, i) => {
                fHTML += `<div class="card"><strong>${f.title}</strong><p>${f.details}</p><button class="btn btn-delete" onclick="delFav(${i})">Supprimer</button></div>`;
            });
            document.getElementById('favContainer').innerHTML = fHTML;
        }
        function delMeal(k) {
            let meals = JSON.parse(localStorage.getItem('meals') || '{}');
            delete meals[k];
            localStorage.setItem('meals', JSON.stringify(meals));
            loadAll();
        }
        function delFav(i) {
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            favs.splice(i, 1);
            localStorage.setItem('favs', JSON.stringify(favs));
            loadAll();
        }
    </script>
</body>
</html>
